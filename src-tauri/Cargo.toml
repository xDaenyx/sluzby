[package]
name = "medishift-ai-pro"
version = "0.1.0"
description = "MediShift AI Pro — KJ 2026 — Desktopová aplikace"
authors = []
license = ""
repository = ""
default-run = "medishift-ai-pro"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
